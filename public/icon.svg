<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>
  <!-- Background with subtle corner radius -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#a7f3d0" stroke-width="8" stroke-dasharray="16 12" opacity="0.4" />
  
  <!-- Central Protective Hands / Caring Symbol -->
  <g transform="translate(256, 260) scale(1.15)">
    <!-- Heart Symbol -->
    <path d="M0 -60 C-40 -120 -110 -80 -110 -20 C-110 40 -30 90 0 120 C30 90 110 40 110 -20 C110 -80 40 -120 0 -60 Z" fill="url(#heartGrad)" />
    
    <!-- Cross in heart for healthcare -->
    <path d="M-12 -10 H12 V-34 H-12 Z M-34 0 H-10 V24 H10 V0 H34 V-16 H10 V-16 Z" fill="#ffffff" opacity="0.95" />
    <rect x="-10" y="-34" width="20" height="52" rx="6" fill="#ffffff" />
    <rect x="-26" y="-18" width="52" height="20" rx="6" fill="#ffffff" />
    
    <!-- Supporting leaf / caring arc -->
    <path d="M-130 60 C-90 120 -20 150 50 140 C110 130 140 90 150 40 C120 70 70 90 10 80 C-50 70 -100 40 -130 60 Z" fill="#6ee7b7" opacity="0.9" />
  </g>
</svg>
